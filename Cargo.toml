[package]
name = "rebonebase"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
description = "Standalone native Rust skeletal pixel animation editor"
publish = false

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
rfd = "0.16"
anyhow = "1"
base64 = "0.22"
glam = "0.30"
gltf = { version="1.4", default-features=false, features=["utils","names"] }
flate2 = "1"
png = "0.18"
ufbx = "0.11.5"

[dev-dependencies]
mlua = { version = "0.9", features = ["lua54", "vendored", "serialize"] }
asefile = "0.3"

[profile.release]
lto = "thin"
strip = true
